<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="BillPay Protocol"><defs><radialGradient id="r1" cx="1" cy="0" r=".7"><stop offset="0" stop-color="#F2742F" stop-opacity=".28"/><stop offset="1" stop-color="#F2742F" stop-opacity="0"/></radialGradient><radialGradient id="r2" cx="0" cy="1" r=".7"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".16"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#F2742F"/></linearGradient></defs><rect width="1200" height="630" fill="#07111F"/><rect width="1200" height="630" fill="url(#r1)"/><rect width="1200" height="630" fill="url(#r2)"/><svg x="80" y="70" width="96" height="96" viewBox="0 0 120 120"><defs><linearGradient id="ib" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A5F"/><stop offset="1" stop-color="#07111F"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4DECE"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter></defs><rect x="1" y="1" width="118" height="118" rx="28" fill="url(#ib)" stroke="#fff" stroke-opacity=".14" stroke-width="2"/><path d="M38 18H82Q90 18 90 26V96L84 90L78 96L72 90L66 96L60 90L54 96L48 90L42 96L36 90L30 96V26Q30 18 38 18Z" fill="url(#paper)" filter="url(#sh)"/><circle cx="60" cy="46" r="24" fill="none" stroke="#FFC15E" stroke-opacity=".35" stroke-width="2"/><circle cx="60" cy="46" r="18" fill="url(#gold)"/><path d="M51 46l6 6 12-13" fill="none" stroke="#0E1B2C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="73" width="36" height="5" rx="2.5" fill="#0E1B2C" opacity=".85"/><rect x="42" y="81" width="22" height="4" rx="2" fill="#0E1B2C" opacity=".3"/></svg><text x="196" y="132" font-family="Space Grotesk,Helvetica,Arial,sans-serif" font-weight="700" font-size="60" letter-spacing="-2" fill="#F6F4EF">Bill<tspan fill="url(#gold)">Pay</tspan></text><text x="198" y="160" font-family="Space Grotesk,Helvetica,Arial,sans-serif" font-size="16" letter-spacing="6" fill="#A9B6C7">PROTOCOL · $BILL</text><text x="80" y="290" font-family="Space Grotesk,Helvetica,Arial,sans-serif" font-weight="700" font-size="76" letter-spacing="-2" fill="#F6F4EF">Каждый обмен<tspan x="80" dy="84">оплачивает счёт.</tspan></text><g transform="translate(80 470)"><rect width="491" height="56" rx="28" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/><text x="245.5" y="36" text-anchor="middle" font-family="Space Grotesk,Helvetica,Arial,sans-serif" font-weight="500" font-size="24" fill="#F6F4EF">Взнос 10 %, виден в блокчейне</text></g><g transform="translate(587 470)"><rect width="566" height="56" rx="28" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/><text x="283.0" y="36" text-anchor="middle" font-family="Space Grotesk,Helvetica,Arial,sans-serif" font-weight="500" font-size="24" fill="#F6F4EF">Ликвидность заблокирована навсегда</text></g><g transform="translate(80 546)"><rect width="251" height="56" rx="28" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/><text x="125.5" y="36" text-anchor="middle" font-family="Space Grotesk,Helvetica,Arial,sans-serif" font-weight="500" font-size="24" fill="#F6F4EF">Без владельца</text></g></svg>
